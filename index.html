<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coral Club · Инициативы</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Coral Club corporate design system tokens */
  --bg:#E5ECEC; --surface:#FFFFFF; --ink:#004643; --ink-soft:#4C7371; --ink-faint:#7FA2A1;
  --coral:#FF4A1C; --coral-dark:#D63C13; --coral-soft:#FFE7DE;
  --teal:#20927B; --teal-soft:#E1F3EE;
  --amber:#A9843A; --amber-soft:#F5EBD6;
  --success:#20927B; --success-soft:#EAF6E4;
  --border:#BFD1D0; --radius:0px; --radius-sm:0px;
  --shadow:0 1px 2px rgba(0,70,67,.05), 0 8px 24px rgba(0,70,67,.07);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Inter',sans-serif;font-weight:300;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--coral-soft);}

#app{min-height:100vh;display:flex;flex-direction:column;}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.test-banner{background:var(--amber);color:#fff;text-align:center;padding:9px 16px;font-size:12.5px;font-weight:700;position:sticky;top:73px;z-index:19;}
.test-banner-btn{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:999px;padding:3px 12px;font-size:11.5px;font-weight:700;margin-left:8px;}
.test-banner-btn:hover{background:rgba(255,255,255,.4);}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--coral), var(--coral-dark));flex:none;}
.brand-text .t1{font-family:'Inter',sans-serif;font-weight:600;font-size:17px;line-height:1.1;}
.brand-text .t2{font-size:11px;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase;}
.role-switch{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.topbar-controls{display:flex;align-items:center;gap:10px;justify-content:flex-end;}
.lang-switch{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.lang-switch button{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--ink-soft);transition:.15s;}
.lang-switch button.active{background:var(--ink);color:#fff;}
.role-switch button{border:none;background:transparent;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-soft);transition:.15s;}
.role-switch button.active{background:var(--ink);color:#fff;}
.role-note{font-size:11px;color:var(--ink-faint);margin-top:4px;text-align:right;}

/* ---------- Layout ---------- */
.main{flex:1;display:flex;width:100%;}
.wizard-shell{flex:1;display:flex;justify-content:center;padding:44px 20px 80px;}
.wizard-card{width:100%;max-width:620px;}

/* progress */
.progress-wrap{margin-bottom:34px;}
.progress-track{display:flex;gap:6px;}
.progress-seg{flex:1;height:5px;border-radius:99px;background:var(--border);overflow:hidden;}
.progress-seg.done{background:var(--coral);}
.progress-seg.current{background:linear-gradient(90deg,var(--coral) 50%,var(--border) 50%);}
.progress-label{margin-top:10px;font-size:12px;color:var(--ink-faint);display:flex;justify-content:space-between;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow);}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);margin-bottom:10px;}
.q-title{font-size:24px;margin:0 0 8px;}
.q-sub{color:var(--ink-soft);font-size:14px;margin:0 0 24px;line-height:1.5;}

.field{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;color:var(--ink);background:#fff;transition:.15s;}
.field:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft);}
textarea.field{resize:vertical;min-height:120px;line-height:1.5;}
.hint{font-size:12px;color:var(--ink-faint);margin-top:8px;}
.char-count{font-size:12px;color:var(--ink-faint);text-align:right;margin-top:6px;}
.error-text{font-size:12px;color:var(--coral-dark);margin-top:8px;font-weight:600;}

.btn{border:none;border-radius:999px;padding:13px 24px;font-size:14px;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#013634;}
.btn-primary:disabled{background:var(--border);color:var(--ink-faint);cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--border);}
.btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
.btn-coral{background:var(--coral);color:#fff;}
.btn-coral:hover{background:var(--coral-dark);}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:0;}
.btn-row{display:flex;justify-content:space-between;align-items:center;margin-top:28px;}
.btn-row .spacer{flex:1;}

.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
.choice-btn{border:1.5px solid var(--border);background:#fff;border-radius:var(--radius);padding:22px 18px;text-align:left;transition:.15s;}
.choice-btn:hover{border-color:var(--ink-soft);}
.choice-btn .cb-title{font-weight:700;font-size:15px;margin-bottom:4px;}
.choice-btn .cb-sub{font-size:12.5px;color:var(--ink-faint);}
.choice-btn.yes:hover{border-color:var(--teal);background:var(--teal-soft);}
.choice-btn.no:hover{border-color:var(--coral);background:var(--coral-soft);}

/* dropdown/autocomplete */
.ac-wrap{position:relative;}
.ac-list{margin-top:8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);max-height:260px;overflow-y:auto;background:#fff;}
.ac-item{padding:11px 15px;font-size:14px;border-bottom:1px solid var(--border);}
.ac-item:last-child{border-bottom:none;}
.ac-item button{width:100%;text-align:left;background:none;border:none;font-size:14px;color:var(--ink);padding:0;}
.ac-item button:hover{color:var(--coral-dark);}
.ac-empty{padding:14px 15px;font-size:13px;color:var(--ink-faint);}
.new-toggle{margin-top:10px;font-size:13px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;padding:0;}
.selected-chip{display:inline-flex;align-items:center;gap:8px;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;margin-top:6px;}
.selected-chip button{background:none;border:none;color:var(--teal);font-weight:700;padding:0;}

/* percent slider */
.percent-display{font-family:'Inter',sans-serif;font-size:56px;font-weight:300;color:var(--coral);line-height:1;margin:6px 0 20px;}

/* batch initiative entry */
.batch-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
.batch-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.batch-idx{width:16px;flex:none;color:var(--ink-faint);font-size:13px;font-weight:600;}
.batch-row .field{margin:0;}
.batch-row input.field.batch-name{flex:1.6;min-width:160px;}
.batch-customer{flex:1;min-width:130px;}
.batch-type{flex:1;min-width:150px;color:var(--ink);}
.batch-percent{display:flex;align-items:center;gap:4px;flex:none;width:76px;border:1.5px solid var(--border);padding:0 8px;background:#fff;}
.batch-percent input{width:38px;border:none;padding:11px 0;font-size:14px;text-align:right;}
.batch-percent input:focus{outline:none;}
.batch-percent span{color:var(--ink-faint);font-size:13px;}
.percent-banner{display:flex;justify-content:space-between;align-items:center;background:var(--teal-soft);color:var(--teal);padding:12px 16px;font-weight:700;font-size:13.5px;margin-top:14px;}
.percent-banner.over{background:var(--coral-soft);color:var(--coral-dark);}
.percent-banner b{font-size:16px;}

/* initiative list (step 3) */
.init-list{display:flex;flex-direction:column;gap:8px;max-height:480px;overflow-y:auto;margin-bottom:6px;}
.init-row{display:flex;align-items:center;gap:12px;border:1.5px solid var(--border);padding:12px 14px;}
.init-row.checked{border-color:var(--coral);background:var(--coral-soft);}
.init-row input[type=checkbox]{flex:none;width:17px;height:17px;accent-color:var(--coral);}
.init-main{flex:1;cursor:pointer;min-width:0;}
.init-name{font-weight:700;font-size:13.5px;}
.init-meta{font-size:12px;color:var(--ink-faint);margin-top:2px;}
input[type=range]{width:100%;accent-color:var(--coral);height:6px;}

/* project / goal search results */
.search-item{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s;}
.search-item:hover{border-color:var(--coral);background:var(--coral-soft);}
.search-item .si-name{font-weight:700;font-size:14px;margin-bottom:4px;}
.search-item .si-goal{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}
.type-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:0;margin-bottom:6px;}
.type-tag.run{background:var(--teal-soft);color:var(--teal);}
.type-tag.change{background:var(--coral-soft);color:var(--coral-dark);}
.type-tag.none{background:var(--bg);color:var(--ink-faint);}

/* compact expandable list (projects) */
.list-toolbar{position:sticky;top:0;background:var(--bg);padding-bottom:12px;margin-bottom:6px;z-index:5;}
.list-toolbar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.list-toolbar-row:last-child{margin-bottom:0;}
.list-toolbar input.field{flex:1;min-width:200px;}
.list-toolbar-row select{padding:7px 14px;border:1.5px solid var(--border);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:#fff;}
.filter-chip{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:700;color:var(--ink-soft);transition:.15s;}
.filter-chip:hover{border-color:var(--ink-soft);}
.filter-chip.active{border-color:var(--ink);background:var(--ink);color:#fff;}
.filter-chip.active.run{border-color:var(--teal);background:var(--teal);}
.filter-chip.active.change{border-color:var(--coral);background:var(--coral);}
.list-count{font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
.proj-list{max-height:520px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;}
.proj-row{border-bottom:1px solid var(--border);}
.proj-row:last-child{border-bottom:none;}
.proj-row-head{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;}
.proj-row-head:hover{background:var(--bg);}
.proj-row.expanded .proj-row-head{background:var(--coral-soft);}
.proj-caret{font-size:11px;color:var(--ink-faint);width:12px;flex:none;}
.proj-name{font-weight:700;font-size:13.5px;flex:1;}
.proj-row-body{padding:6px 16px 20px 38px;background:#fbfbfc;border-top:1px solid var(--border);}
.field-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);margin:14px 0 7px;}
.field-label:first-child{margin-top:2px;}
.type-chip-row{display:flex;gap:8px;}
.type-chip{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
.type-chip.active-run{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);}
.type-chip.active-change{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-dark);}
.type-chip.active-neutral{border-color:var(--ink-soft);background:var(--bg);color:var(--ink);}

/* project tiles */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;max-height:560px;overflow-y:auto;padding:4px 4px 8px;}
.tile-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:96px;}
.tile-card:hover{border-color:var(--coral);box-shadow:var(--shadow);}
.tile-name{font-weight:700;font-size:13.5px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.tile-customer{align-self:flex-start;border:1.5px solid var(--coral);color:var(--coral-dark);border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700;white-space:nowrap;}
.tile-customer.none{border-color:var(--border);color:var(--ink-faint);}

/* accordion tracks */
.track-block{border:1.5px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;}
.track-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;cursor:pointer;background:#fff;}
.track-head:hover{background:var(--bg);}
.track-head .th-name{font-weight:700;font-size:14.5px;}
.track-head .th-mission{font-size:12px;color:var(--ink-faint);margin-top:3px;}
.track-body{padding:0 16px 16px;background:#fbfbfc;border-top:1px solid var(--border);}
.goal-item{padding:13px 0;border-bottom:1px dashed var(--border);}
.goal-item:last-child{border-bottom:none;}
.goal-text{font-size:13.5px;font-weight:600;cursor:pointer;line-height:1.4;}
.goal-text:hover{color:var(--coral-dark);}
.kr-list{margin-top:10px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:0;}
.kr-row{font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--border);}
.kr-row:last-child{border-bottom:none;}
.kr-row .kr-text{font-weight:600;color:var(--ink);}
.kr-row .kr-hint{color:var(--ink-faint);margin-top:3px;font-style:italic;}

/* goal tree (visual, step 6a) */
.tree-wrap{overflow-x:auto;padding:4px 2px 14px;}
.tree-inner{min-width:760px;}
.tree-root{background:var(--ink);color:#fff;border-radius:0;padding:13px 24px;text-align:center;font-weight:700;font-size:13.5px;width:fit-content;margin:0 auto;}
.tree-vline{width:2px;height:20px;background:var(--border);margin:0 auto;}
.tree-hbar{position:relative;height:20px;}
.tree-hbar::before{content:'';position:absolute;left:10%;right:10%;top:0;height:2px;background:var(--border);}
.tree-cols{display:flex;gap:14px;align-items:flex-start;}
.tree-col{flex:1;position:relative;display:flex;flex-direction:column;align-items:stretch;}
.tree-col::before{content:'';position:absolute;top:-20px;left:50%;width:2px;height:20px;background:var(--border);transform:translateX(-1px);}
.tree-track{border-radius:0;padding:12px 12px;text-align:center;border:1.5px solid;font-weight:700;font-size:12.5px;line-height:1.3;}
.tree-track .tt-icon{font-size:18px;display:block;margin-bottom:4px;}
.tree-goal-wrap{margin-top:16px;position:relative;}
.tree-goal-wrap::before{content:'';position:absolute;top:-16px;left:50%;width:2px;height:16px;background:var(--border);transform:translateX(-1px);}
.tree-goal{border:1.5px solid var(--border);background:#fff;border-radius:0;padding:10px 11px;font-size:11.5px;font-weight:600;line-height:1.35;cursor:pointer;margin-bottom:8px;transition:.15s;}
.tree-goal:hover{border-color:var(--coral);}
.tree-goal.selected{border-color:var(--coral);background:var(--coral-soft);}
.tree-goal-second{margin-top:6px;}
.tree-kr-panel{background:#fbfbfc;border:1px solid var(--border);border-radius:0;padding:10px 11px;margin:-2px 0 8px;font-size:11px;}
.tree-kr-panel .kr-row{padding:5px 0;font-size:11px;}
.tree-legend{display:flex;flex-wrap:wrap;gap:8px 18px;border:1px dashed var(--border);border-radius:0;padding:12px 16px;margin-top:18px;font-size:11.5px;color:var(--ink-soft);}
.tree-legend span b{color:var(--ink);}
.wizard-card-wide{max-width:1180px !important;}

/* summary */
.summary-row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.summary-row:last-child{border-bottom:none;}
.summary-row .sr-label{color:var(--ink-faint);flex:none;width:150px;}
.summary-row .sr-val{text-align:right;font-weight:600;}
.result-banner{border-radius:var(--radius-sm);padding:16px;margin-bottom:22px;display:flex;gap:12px;align-items:flex-start;}
.result-banner.project{background:var(--teal-soft);}
.result-banner.goal{background:var(--coral-soft);}
.result-banner.none{background:var(--amber-soft);}
.result-banner .rb-title{font-weight:700;font-size:13.5px;margin-bottom:3px;}
.result-banner .rb-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}

.done-wrap{text-align:center;padding:20px 0;}
.done-icon{width:58px;height:58px;border-radius:50%;background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;}

/* ---------- Admin ---------- */
.admin-shell{display:flex;flex:1;width:100%;}
.admin-nav{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;}
.admin-nav button{display:block;width:100%;text-align:left;padding:11px 14px;border:none;background:none;border-radius:0;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:2px;}
.admin-nav button.active{background:var(--ink);color:#fff;}
.admin-nav button:hover:not(.active){background:var(--bg);color:var(--ink);}
.admin-main{flex:1;padding:32px 36px;max-width:1180px;}
.admin-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;}
.admin-header h2{margin:0 0 4px;font-size:22px;}
.admin-header p{margin:0;color:var(--ink-soft);font-size:13.5px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:30px;}
.test-toggle-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px;}
.test-toggle{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;}
.test-toggle input{width:34px;height:19px;accent-color:var(--amber);cursor:pointer;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.stat-card .sc-num{font-family:'Inter',sans-serif;font-size:32px;font-weight:300;}
.stat-card .sc-label{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.stat-card.coral .sc-num{color:var(--coral);}
.stat-card.teal .sc-num{color:var(--teal);}
.stat-card.amber .sc-num{color:var(--amber);}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:13px;}
thead th{text-align:left;background:var(--bg);color:var(--ink-faint);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:11px 14px;border-bottom:1px solid var(--border);}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fbfbfc;}
.cell-truncate{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
select.type-select{border:1.5px solid var(--border);border-radius:0;padding:6px 9px;font-size:12.5px;font-weight:600;background:#fff;}
.icon-btn{border:none;background:none;color:var(--ink-faint);padding:4px 6px;border-radius:0;font-size:12px;}
.icon-btn:hover{background:var(--bg);color:var(--coral-dark);}
.toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
.toolbar select,.toolbar input{padding:9px 12px;border:1.5px solid var(--border);border-radius:0;font-size:13px;}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13.5px;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(11,37,69,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:#fff;border-radius:var(--radius);padding:28px;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;}
.modal-box h3{margin:0 0 18px;font-size:18px;}
.modal-box label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.03em;}

const SUPABASE_KEY = 'sb_publishable_t94mAXN3a3ql6fGuoIf8Lg_HMrcSGiy';
const storage = {
  async get(key, shared){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_kv?key=eq.${encodeURIComponent(key)}&select=value`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    if(!res.ok) throw new Error('supabase get failed: '+res.status);
    const rows = await res.json();
    if(!rows.length){ const e=new Error('not found'); throw e; }
    return {key, value: JSON.stringify(rows[0].value), shared:!!shared};
  },
  async set(key, value, shared){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_kv`, {
      method:'POST',
      headers:{
        apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type':'application/json',
        Prefer:'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify([{ key, value: JSON.parse(value), updated_at: new Date().toISOString() }])
    });
    if(!res.ok){ throw new Error('supabase set failed: '+res.status); }
    return {key, value, shared:!!shared};
  },
  async delete(key, shared){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_kv?key=eq.${encodeURIComponent(key)}`, {
      method:'DELETE',
      headers:{ apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    if(!res.ok) throw new Error('supabase delete failed: '+res.status);
    return {key, deleted:true, shared:!!shared};
  },
  async list(prefix, shared){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_kv?key=like.${encodeURIComponent((prefix||'')+'*')}&select=key`, {
      headers:{ apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    if(!res.ok) throw new Error('supabase list failed: '+res.status);
    const rows = await res.json();
    return {keys: rows.map(r=>r.key), prefix, shared:!!shared};
  }
};
async function loadKey(key, seed){
  try{
    const r = await storage.get(key, true);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){}
  try{ await storage.set(key, JSON.stringify(seed), true); }catch(e){}
  return seed;
}
async function saveKey(key, data){
  try{ await storage.set(key, JSON.stringify(data), true); }
  catch(e){ showToast(tr('Не удалось сохранить изменения. Попробуйте ещё раз.'), 'error'); }
}

async function submitPassword(){
  const el = document.getElementById('passwordInput');
  const v = el ? el.value : '';
  const btn = document.getElementById('loginSubmitBtn');
  if(btn) btn.disabled = true;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/check_login`, {
      method:'POST',
      headers:{
        apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type':'application/json'
      },
      body: JSON.stringify({ p_password: v })
    });
    if(!res.ok) throw new Error('auth check failed: '+res.status);
    const role = await res.json(); // 'lead' | 'admin' | null
    if(role==='lead' || role==='admin'){
      state.authed=true; state.role=role; state.authError=false; render();
    } else {
      state.authError=true; render();
      const el2 = document.getElementById('passwordInput');
      if(el2){ el2.focus(); el2.select && el2.select(); }
    }
  } catch(e){
    state.authError=true; render();
  }
}

async function submitBatchEntry(){
  const w = state.wizard;
  const filled = w.batchRows.filter(r=>r.text && r.text.trim());
  if(!filled.length){ showToast(tr('Добавьте хотя бы одну активность'),'error'); return; }
  const sum = w.batchRows.reduce((s,r)=> s + (parseInt(r.percent)||0), 0);
  if(sum>100){ showToast(tr('Сумма процентов превышает 100% — уменьшите долю одной из активностей'),'error'); return; }

  const keepIds = filled.filter(r=>r.id).map(r=>r.id);
  const stalePendingIds = state.initiatives
    .filter(i=> w.sessionIds.includes(i.id) && i.category===null && !keepIds.includes(i.id))
    .map(i=>i.id);
  if(stalePendingIds.length){
    state.initiatives = state.initiatives.filter(i=>!stalePendingIds.includes(i.id));
    w.sessionIds = w.sessionIds.filter(id=>!stalePendingIds.includes(id));
  }

  filled.forEach(r=>{
    if(r.id){
      const it = state.initiatives.find(i=>i.id===r.id);
      if(it){ it.text=r.text.trim(); it.customer=(r.customer||'').trim(); it.percent=parseInt(r.percent)||0; it.activityType=r.activityType||''; }
    } else {
      const rec = { id:uid('init'), department:w.department, text:r.text.trim(), customer:(r.customer||'').trim(),
        percent:parseInt(r.percent)||0, activityType:r.activityType||'', category:null, projectId:null, trackId:null, goalId:null,
        isTest: !!state.testMode,
        submittedAt:new Date().toISOString() };
      state.initiatives = [...state.initiatives, rec];
      w.sessionIds.push(rec.id);
    }
  });
  await saveKey('data:initiatives', state.initiatives);
  if(w.isNewDept && !state.departments.some(d=>d.name===w.department)){
    state.departments = [...state.departments, {id:uid('d'), name:w.department}];
    await saveKey('meta:departments', state.departments);
  }
  jumpStep('3');
}
function backToBatchEntry(){

  state.wizard.batchRows = pending.length? pending : [{text:'',customer:'',percent:20,activityType:''}];
  goStep('2');
}

function progressBar(){
  const idx = progressIndex(state.wizard.step);
  const labels = [tr('Отдел'),tr('Инициатива'),tr('Загрузка'),tr('Заказчик'),tr('Проект?'),tr('Цель трека?'),tr('Итог')];
  let segs='';
  for(let i=0;i<7;i++){
    let cls = i<idx?'done':(i===idx?'current':'');
    segs += `<div class="progress-seg ${cls}"></div>`;
  }
  return `<div class="progress-wrap"><div class="progress-track">${segs}</div>
    <div class="progress-label"><span>${tr('Шаг')} ${idx+1} ${tr('из 7')}</span><span>${labels[idx]}</span></div></div>`;
}

  if(w.step==='1') body = stepDept();
  else if(w.step==='1g') body = stepGlossary();

let glossaryResizeBound = false;
function drawGlossaryLines(){
  const svg = document.getElementById('glSvgLines');
  const wrapper = document.querySelector('.glossary-embed .gl-wrapper');
  if(!svg || !wrapper) return;
  const connections = [
    ['gl-n-strategic','gl-n-project'], ['gl-n-strategic','gl-n-okrR'],
    ['gl-n-project','gl-n-okrL'], ['gl-n-okrL','gl-n-taskL'], ['gl-n-okrR','gl-n-taskR'],
    ['gl-n-taskL','gl-n-product'], ['gl-n-taskL','gl-n-process'], ['gl-n-taskR','gl-n-process'],
  ];
  function centerPoint(el, side){
    const r = el.getBoundingClientRect(), w = wrapper.getBoundingClientRect();
    const x = r.left - w.left + r.width/2;
    return side==='bottom' ? {x, y:r.bottom-w.top} : {x, y:r.top-w.top};
  }
  function bezier(p1,p2){ const midY=(p1.y+p2.y)/2; return `M ${p1.x} ${p1.y} C ${p1.x} ${midY}, ${p2.x} ${midY}, ${p2.x} ${p2.y}`; }
  const wr = wrapper.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${wr.width} ${wr.height}`);
  svg.innerHTML='';
  connections.forEach(([fromId,toId])=>{
    const from=document.getElementById(fromId), to=document.getElementById(toId);
    if(!from||!to) return;
    const p1=centerPoint(from,'bottom'), p2=centerPoint(to,'top');
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', bezier(p1,p2));
    svg.appendChild(path);
  });
}
function glSetState(node, st){
  node.querySelectorAll('.gl-term-text').forEach(el=>{ el.hidden=true; });
  const target = node.querySelector('.gl-'+st);
  if(target) target.hidden=false;
  node.querySelectorAll('.gl-tab-btn').forEach(btn=> btn.classList.toggle('active', btn.dataset.state===st));
  const label = node.querySelector('.gl-term-label');
  if(label) label.textContent = st==='def'?tr('Термин'):(st==='ex'?tr('Пример'):tr('Вопрос'));
  node.classList.toggle('gl-state-q', st==='q');
  requestAnimationFrame(drawGlossaryLines);
}
function initGlossaryTree(){
  const root = document.querySelector('.glossary-embed');
  if(!root) return;
  root.querySelectorAll('.gl-node').forEach(node=>{
    node.querySelectorAll('.gl-tab-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{ e.stopPropagation(); glSetState(node, btn.dataset.state); });
    });
  });
  const resetBtn = document.getElementById('glResetAll');
  if(resetBtn) resetBtn.addEventListener('click', ()=> root.querySelectorAll('.gl-node').forEach(n=>glSetState(n,'def')));
  requestAnimationFrame(drawGlossaryLines);
  setTimeout(drawGlossaryLines, 150);
  if(!glossaryResizeBound){
    window.addEventListener('resize', ()=>{ if(document.querySelector('.glossary-embed')) drawGlossaryLines(); });
    glossaryResizeBound = true;
  }
}

/* ---- Excel export by company template ---- */
let excelJsLoadPromise = null;
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  if(excelJsLoadPromise) return excelJsLoadPromise;
  excelJsLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ excelJsLoadPromise=null; reject(new Error('exceljs load failed')); };
    document.head.appendChild(s);
  });
  return excelJsLoadPromise;
}

async function exportInitiativesExcel(){
  const btn = document.getElementById('excelExportBtn');
  if(btn){ btn.disabled = true; btn.textContent = tr('Формируем файл…'); }
  try{
    await loadExcelJS();
    const rows = filteredInitiatives();

    const wb = new window.ExcelJS.Workbook();
    const ws = wb.addWorksheet('Лист1');

    const headers = ['№','Дата заполнения','Функция (кто заполнял опроник)','Название инициативы',
      'Заказчик инициативы','Время % в неделю','Название проекта в ктором участвует',
      'Название трека','Цель трека которому способствует'];
    const headerRow = ws.addRow(headers);
    headerRow.eachCell(cell=>{
      cell.font = { name:'Arial', bold:true };
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF3F3F3' } };
    });

    rows.forEach((r,i)=>{
      const p = r.projectId ? findProject(r.projectId) : null;
      const t = r.trackId ? findTrack(r.trackId) : null;
      const g = (r.trackId && r.goalId) ? findGoal(r.trackId, r.goalId) : null;
      const row = ws.addRow([
        i+1,
        new Date(r.submittedAt),
        r.department,
        r.text,
        r.customer,
        r.percent/100,
        p ? p.name : '',
        t ? t.name : '',
        g ? g.text : ''
      ]);
      row.getCell(2).numFmt = 'dd.mm.yyyy';
      row.getCell(6).numFmt = '0%';
      row.eachCell(cell=>{ cell.font = { name:'Arial' }; });
    });

    ws.columns = [
      {width:5},{width:14},{width:26},{width:42},{width:22},{width:14},{width:34},{width:20},{width:42}
    ];
    ws.views = [{ state:'frozen', ySplit:1 }];

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `coral-club-initiatives-${stamp}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    showToast(tr('Файл Excel скачан'));
  } catch(e){
    showToast(tr('Не удалось сформировать Excel-файл. Попробуйте ещё раз.'), 'error');
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = tr('Скачать Excel (по шаблону)'); }
  }
}

  const depts = [...new Set(state.initiatives.map(i=>i.department))];
  return `
  <div class="admin-header"><div><h2>${tr('Инициативы')}</h2><p>${state.initiatives.length} ${tr('подано всего, показано')} ${rows.length}</p></div>
  <div style="display:flex;gap:8px;">
    <button id="excelExportBtn" class="btn btn-coral btn-sm" onclick="exportInitiativesExcel()">${tr('Скачать Excel (по шаблону)')}</button>
    <button class="btn btn-ghost btn-sm" onclick="openExportModal()">${tr('Экспорт CSV')}</button>
  </div></div>
  <div class="toolbar">
    <select onchange="setInitDeptFilter(this.value)">
      <option value="">${tr('Все отделы')}</option>
      ${depts.map(d=>`<option value="${esc(d)}" ${state.admin.initDeptFilter===d?'selected':''}>${esc(tr(d))}</option>`).join('')}
    </select>
    <select onchange="setInitCatFilter(this.value)">
      <option value="all" ${state.admin.initCatFilter==='all'?'selected':''}>${tr('Все категории')}</option>
      <option value="pending" ${state.admin.initCatFilter==='pending'?'selected':''}>${tr('Не обработана')}</option>
      <option value="project" ${state.admin.initCatFilter==='project'?'selected':''}>${tr('Часть проекта')}</option>
      <option value="goal" ${state.admin.initCatFilter==='goal'?'selected':''}>${tr('Влияет на цель')}</option>
      <option value="none" ${state.admin.initCatFilter==='none'?'selected':''}>${tr('Самостоятельная')}</option>
    </select>
    <select onchange="setInitTestFilter(this.value)">
      <option value="all" ${state.admin.initTestFilter==='all'?'selected':''}>${tr('Тест и реальные')}</option>
      <option value="real" ${state.admin.initTestFilter==='real'?'selected':''}>${tr('Только реальные')}</option>
      <option value="test" ${state.admin.initTestFilter==='test'?'selected':''}>${tr('Только тестовые')}</option>
    </select>
    ${rows.length? `<button class="btn btn-ghost btn-sm" onclick="markVisibleAsTest()">${tr('Пометить видимые как тест')}</button>`:''}
  </div>
  ${rows.length? `<table><thead><tr><th style="width:70px">${tr('Тест')}</th><th>${tr('Отдел')}</th><th>${tr('Инициатива')}</th><th>${tr('Тип активности')}</th><th style="width:60px">%</th><th>${tr('Заказчик')}</th><th>${tr('Отнесена к')}</th><th style="width:100px">${tr('Дата')}</th></tr></thead>
  <tbody>${rows.map(r=>`<tr${r.isTest?' style="background:var(--amber-soft);"':''}>
    <td><label style="display:flex;align-items:center;gap:0;"><input type="checkbox" ${r.isTest?'checked':''} onchange="toggleInitiativeTest('${r.id}')"></label></td>
    <td>${esc(tr(r.department))}</td>
    <td class="cell-truncate" title="${esc(r.text)}">${esc(r.text)}</td>
    <td>${r.activityType? esc(activityTypeLabel(r.activityType)) : '—'}</td>
    <td>${r.percent}%</td>
    <td>${esc(r.customer)}</td>
    <td class="cell-truncate" title="${esc(categoryLabel(r))}">${esc(categoryLabel(r))}</td>
    <td>${new Date(r.submittedAt).toLocaleDateString(state.lang==='en'?'en-GB':'ru-RU')}</td>
  </tr>`).join('')}</tbody></table>` : '<div class="empty-state">'+tr('Инициатив пока нет — как только руководители начнут заполнять форму, они появятся здесь.')+'</div>'}`;
}

/* =========================================================
   MODALS
   ========================================================= */
function renderModal(){
  const m = state.modal;
  if(!m) return '';
  let content='';
  if(m.kind==='addProject' || m.kind==='editProject'){
    const p = m.id? state.projects.find(p=>p.id===m.id) : {name:'',goal:'',division:'',customer:''};
    content = `<h3>${m.id?tr('Редактировать проект'):tr('Добавить проект')}</h3>
      <label>${tr('Название')}</label><input id="mProjName" class="field" value="${esc(m.id?tr(p.name):p.name)}">
      <label>${tr('Дивизион')}</label><input id="mProjDivision" class="field" placeholder="${tr('Например, GLOBAL')}" value="${esc(p.division||'')}">
      <label>${tr('Заказчик (функция)')}</label><input id="mProjCustomer" class="field" placeholder="${tr('Например, Finance')}" value="${esc(p.customer||'')}">
      <label>${tr('Цель')}</label><textarea id="mProjGoal" class="field" style="min-height:80px;">${esc(m.id?tr(p.goal||''):(p.goal||''))}</textarea>
      ${m.id? `<label>${tr('Тип проекта')}</label>
      <div class="type-chip-row">
        <button type="button" class="type-chip ${p.type==='RUN'?'active-run':''}" onclick="setProjectType('${m.id}','RUN')">RUN</button>
        <button type="button" class="type-chip ${p.type==='CHANGE'?'active-change':''}" onclick="setProjectType('${m.id}','CHANGE')">CHANGE</button>
        <button type="button" class="type-chip ${!p.type?'active-neutral':''}" onclick="setProjectType('${m.id}','')">${tr('Не задан')}</button>
      </div>` : ''}
      <div class="modal-actions">
      ${m.id? `<button class="btn btn-ghost" style="color:var(--coral-dark);margin-right:auto;" onclick="deleteProject('${m.id}')">${tr('Удалить')}</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">${tr('Отмена')}</button>
      <button class="btn btn-primary" onclick="${m.id?`submitEditProject('${m.id}')`:'submitAddProject()'}">${tr('Сохранить')}</button></div>`;
  } else if(m.kind==='projectPreview'){
    const p = state.projects.find(p=>p.id===m.id);
    content = `<h3>${esc(tr(p.name))}</h3>
      <p class="q-sub" style="margin:0 0 16px;">${esc(p.division? tr(p.division) : '—')} · ${esc(p.customer? tr(p.customer) : tr('без заказчика'))}${p.type?` · ${p.type}`:''}</p>
      ${p.goal? `<div class="si-goal" style="line-height:1.5;">${esc(tr(p.goal))}</div>` : `<div class="ac-empty" style="padding:0;">${tr('Цель проекта пока не заполнена в справочнике')}</div>`}
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('Отмена')}</button>
      <button class="btn btn-coral" onclick="pickProject('${p.id}')">${tr('Выбрать этот проект →')}</button></div>`;
  } else if(m.kind==='editInitiative'){
    const it = state.initiatives.find(i=>i.id===m.id);
    content = `<h3>${tr('Редактировать активность')}</h3>
      <label>${tr('Название активности')}</label><textarea id="mInitText" class="field" style="min-height:70px;">${esc(it.text)}</textarea>
      <label>${tr('Заказчик')}</label><input id="mInitCustomer" class="field" value="${esc(it.customer)}">
      <label>${tr('% времени в неделю')}</label><input id="mInitPercent" type="number" min="0" max="100" class="field" value="${it.percent}">
      <label>${tr('Тип активности')}</label>
      <select id="mInitType" class="field">
        <option value="" ${!it.activityType?'selected':''}>—</option>
        ${ACTIVITY_TYPES.map(t=>`<option value="${t.id}" ${it.activityType===t.id?'selected':''}>${esc(tr(t.label))}</option>`).join('')}
      </select>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('Отмена')}</button>
      <button class="btn btn-primary" onclick="submitEditInitiative('${m.id}')">${tr('Сохранить')}</button></div>`;
  } else if(m.kind==='addTrack'){
    content = `<h3>${tr('Добавить трек')}</h3>
      <label>${tr('Название трека')}</label><input id="mTrackName" class="field">
      <label>${tr('Миссия')}</label><textarea id="mTrackMission" class="field" style="min-height:70px;"></textarea>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('Отмена')}</button>
      <button class="btn btn-primary" onclick="submitAddTrack()">${tr('Добавить')}</button></div>`;
  } else if(m.kind==='addGoal'){
    content = `<h3>${tr('Добавить цель')}</h3>
      <label>${tr('Текст цели (18 мес.)')}</label><textarea id="mGoalText" class="field" style="min-height:90px;"></textarea>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('Отмена')}</button>
      <button class="btn btn-primary" onclick="submitAddGoal('${m.trackId}')">${tr('Добавить')}</button></div>`;
  } else if(m.kind==='addKr'){
    content = `<h3>${tr('Добавить KR')}</h3>
      <label>${tr('Текст KR')}</label><textarea id="mKrText" class="field" style="min-height:70px;"></textarea>
      <label>${tr('Пример-подсказка (необязательно)')}</label><textarea id="mKrHint" class="field" style="min-height:60px;"></textarea>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('Отмена')}</button>
      <button class="btn btn-primary" onclick="submitAddKr('${m.trackId}','${m.goalId}')">${tr('Добавить')}</button></div>`;
  } else if(m.kind==='addDept'){
    content = `<h3>${tr('Добавить отдел')}</h3>
      <label>${tr('Название отдела')}</label><input id="mDeptName" class="field">
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('Отмена')}</button>
      <button class="btn btn-primary" onclick="submitAddDept()">${tr('Добавить')}</button></div>`;
  } else if(m.kind==='mergeDept'){
    const sel = state.departments.filter(d=>state.admin.selectedDept.has(d.id));
    content = `<h3>${tr('Объединить отделы')}</h3><p class="q-sub">${tr('Выберите каноническое название — остальные будут удалены, а все их инициативы перепривяжутся к нему.')}</p>
      ${sel.map((d,i)=>`<div class="merge-option"><input type="radio" name="mergeCanon" value="${d.id}" id="mc_${d.id}" ${i===0?'checked':''}><label for="mc_${d.id}" style="margin:0;text-transform:none;font-weight:500;font-size:13.5px;color:var(--ink);">${esc(tr(d.name))}</label></div>`).join('')}
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('Отмена')}</button>
      <button class="btn btn-primary" onclick="submitMerge()">${tr('Объединить')}</button></div>`;
  } else if(m.kind==='export'){
    content = `<h3>${tr('Экспорт CSV')}</h3><p class="q-sub">${tr('Скопируйте текст ниже и вставьте в Excel (разделитель — «;»).')}</p>
      <textarea class="field" style="min-height:220px;font-family:monospace;font-size:11.5px;" onclick="this.select()" readonly>${esc(m.csv)}</textarea>
      <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">${tr('Готово')}</button></div>`;
  }
  return `<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal-box">${content}</div></div>`;
}

/* =========================================================
   ROOT RENDER
   ========================================================= */
function render(){
  const root = document.getElementById('app');
  if(!state.ready){ root.innerHTML = '<div class="loading-shell">'+(state.lang==='en'?'Loading data…':'Загружаем данные…')+'</div>'; return; }
  // preserve focus + cursor position across full re-render (search fields etc.)
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = (active && 'selectionStart' in active) ? active.selectionStart : null;
  const selEnd = (active && 'selectionEnd' in active) ? active.selectionEnd : null;

  if(!state.authed){
    root.innerHTML = renderLogin();
  } else {
    root.innerHTML = `
      ${renderTopbar()}
      ${state.testMode? renderTestBanner() : ''}
      <div class="main">${state.role==='lead' ? renderWizard() : renderAdmin()}</div>
      ${state.modal? renderModal() : ''}
      ${state.toast? `<div class="toast ${state.toast.type==='error'?'error':''}">${esc(state.toast.msg)}</div>` : ''}
    `;
  }

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  if(state.authed && state.role==='lead' && state.wizard.step==='1g'){ initGlossaryTree(); }
}

boot();
</script>
